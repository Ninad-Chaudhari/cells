name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -m unittest discover -s tests -t tests -v
      - run: bash -n install.sh bin/cell bin/cell-screen bin/cell-agent-run bin/cells-env bin/cell-screen-run bin/cell-kb-commit bin/need-help bin/cell-chrome
